    - name: Read and Sync Images
      run: |
        set -euo pipefail
        
        if [ ! -f images.txt ]; then
          echo "::error::images.txt 不存在，请先创建该文件！"
          exit 1
        fi
        
        failed=0
        success=0
        
        while IFS= read -r image || [ -n "$image" ]; do
          # 跳过空行和注释
          line=$(echo "$image" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          [ -z "$line" ] && continue
          [[ "$line" == \#* ]] && continue
          
          echo "========================================"
          echo "开始处理: $line"
          echo "========================================"
          
          # 1. 从 Docker Hub 拉取
          if ! docker pull "$line"; then
            echo "::error::拉取失败: $line"
            failed=$((failed + 1))
            continue
          fi
          
          # 2. 解析镜像名
          # 去掉 docker.io/ 前缀（如果有）
          raw_image="${line#docker.io/}"
          
          # 分离仓库和标签
          if [[ "$raw_image" == *:* ]]; then
            raw_repo="${raw_image%:*}"
            raw_tag="${raw_image##*:}"
          else
            raw_repo="$raw_image"
            raw_tag="latest"
          fi
          
          # 3. 【关键修复】处理官方镜像的 library/ 前缀
          # Docker Hub 官方镜像如 postgres:15-alpine 实际为 library/postgres:15-alpine
          # 推送到阿里云时必须去掉 library/ 前缀，否则会变成 library_postgres
          clean_repo=$(echo "$raw_repo" | sed 's|^library/||' | tr '/' '_')
          
          # 4. 构建目标地址
          TARGET_IMAGE="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${clean_repo}:${raw_tag}"
          
          echo "源镜像: $line"
          echo "解析仓库: $raw_repo -> 清洗后: $clean_repo"
          echo "目标地址: $TARGET_IMAGE"
          
          # 5. 打标签并推送
          docker tag "$line" "$TARGET_IMAGE"
          
          if docker push "$TARGET_IMAGE"; then
            echo "::notice::同步成功: $TARGET_IMAGE"
            echo "国内拉取命令: docker pull $TARGET_IMAGE"
            success=$((success + 1))
          else
            echo "::error::推送失败: $TARGET_IMAGE"
            failed=$((failed + 1))
          fi
          
          # 清理本地标签避免堆积
          docker rmi "$TARGET_IMAGE" 2>/dev/null || true
          
        done < images.txt
        
        echo "========================================"
        echo "同步完成: 成功 $success, 失败 $failed"
        echo "========================================"
        
        if [ $failed -gt 0 ]; then
          exit 1
        fi
